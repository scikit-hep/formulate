name: unittests

on:
  workflow_dispatch:
  push:
    tags:
      - "*"
    branches:
      - main
      - "ci/*"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unittests:
    name: Tests for Python ${{ matrix.python-version }} on ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        shell: "bash -l {0}"
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        runs-on:
          - ubuntu-latest
        include:
          - python-version: "3.10"
            runs-on: macOS-latest
          - python-version: "3.10"
            runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: mamba-org/setup-micromamba@ce51e99f4bb8a82ab7158c4dc59ef4634c59c4f9 # v3.1.0
        with:
          init-shell: bash
          environment-name: formulate-env
          create-args: >-
            --strict-channel-priority
            conda-forge/label/python_rc::_python_rc
            python=${{ matrix.python-version }} uv

      - name: Add ROOT installation
        if: runner.os == 'Linux' && matrix.python-version != '3.14'
        run: |
          micromamba install root -y
      - name: Install user dependencies
        run: |
          uv pip install .

      - name: Test import to check for dependencies
        run: python -c "import formulate; from formulate import *"

      - name: Install test dependencies
        env:
          ROOT_PACKAGE: ${{ matrix.python-version == '3.14' && ' ' || 'root' }}
        run: |
          # Fix when root is available for Python 3.14
          conda install coveralls uv pytest-cov $ROOT_PACKAGE -y
          uv pip install -U .[dev,test]

      - name: Test with pytest
        run: |
          pytest --cov=formulate --verbose

  pass:
    name: Check required tests
    if: always()
    needs: [unittests]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
