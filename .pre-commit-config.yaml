ci:
  # pre-commit.ci uses these as the commit message *and* the title of the pull
  # request it opens, so they have to stay Conventional Commits for the
  # semantic-pr-title workflow to pass.
  autoupdate_commit_msg: "chore: update pre-commit hooks"
  autofix_commit_msg: "style: pre-commit fixes"
  autoupdate_schedule: monthly

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: requirements-txt-fixer
      - id: trailing-whitespace

  - repo: https://github.com/mgedmin/check-manifest
    rev: "ca7d0d8de779a87ff1458fa81a2788b07a518bcd" # frozen: 0.51
    hooks:
      - id: check-manifest
        stages: [manual]

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: 3a6eb0fadf60b3cccfd80bad9dbb6fae7e47b316 # frozen: v1.10.0
    hooks:
      - id: python-use-type-annotations
      - id: python-check-mock-methods
      - id: python-no-eval
        exclude: "^tests/.*"
      - id: rst-backticks
      - id: rst-directive-colons

  - repo: https://github.com/asottile/pyupgrade
    rev: f22ea0651f4355c655cc581f67813c991c74a312 # frozen: v3.22.0
    hooks:
      - id: pyupgrade
        args: [--py310-plus]

  # Notebook formatting
  - repo: https://github.com/nbQA-dev/nbQA
    rev: f96ec7f3b26a32619435686eb5813235f7e3327e # frozen: 1.9.1
    hooks:
      - id: nbqa-isort
        additional_dependencies: [isort]

      - id: nbqa-pyupgrade
        additional_dependencies: [pyupgrade]
        args: [--py310-plus]

  - repo: https://github.com/kynan/nbstripout
    rev: f5da19ce3b7b40e97c12ee9cd8ce97f48f97ddf7 # frozen: 0.9.1
    hooks:
      - id: nbstripout

  - repo: https://github.com/MarcoGorelli/auto-walrus
    rev: 1743edbed52f3d61886b59d98a27164a8af29c0d # frozen: 0.4.1
    hooks:
      - id: auto-walrus

  #   todo: needs rust, reactivate?
  #  - repo: https://github.com/shssoichiro/oxipng
  #    rev: v9.1.4
  #    hooks:
  #      - id: oxipng

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 39478bf2c099a58683d3f1aedf675105318b078d # frozen: 0.39.0
    hooks:
      - id: check-github-workflows
      - id: check-github-actions
      - id: check-dependabot
      - id: check-readthedocs

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: 82d21874c3242e4dc27bb47641c996902ef64eef # frozen: v0.27
    hooks:
      - id: validate-pyproject
        additional_dependencies: ["validate-pyproject-schema-store[all]"]

  - repo: https://github.com/dannysepler/rm_unneeded_f_str
    rev: 11ea2e723d469f5709897d038e6d2141e7123730 # frozen: v0.2.0
    hooks:
      - id: rm-unneeded-f-str

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c" # frozen: v0.17.3
    hooks:
      - id: ruff-check
        types_or: [python, pyi, jupyter]
        args: [--fix, --show-fixes, --line-length=120]
      # Run the formatter.
      - id: ruff-format
        types_or: [python, pyi, jupyter]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: "ad26ebfa797fcb9b8f83275937c1c1d6e126719c" # frozen: v2.4.1
    hooks:
      - id: mypy
        files: src
        args: []

  - repo: https://github.com/adamchainz/blacken-docs
    rev: "dda8db18cfc68df532abf33b185ecd12d5b7b326" # frozen: 1.20.0
    hooks:
      - id: blacken-docs
        additional_dependencies: [black==24.*]

  - repo: https://github.com/codespell-project/codespell
    rev: "57b21406f092110c18776e39b0bda50d37c945c8" # frozen: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli; python_version<'3.11'
        args: ["-L", "gaus"]

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: "331f33fa4dfbcbca7c3da3620c137fde0faab273" # frozen: v3.9.10
    hooks:
      - id: prettier
        types_or: [yaml, markdown, html, css, scss, javascript, json]

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f # frozen: v1.31.1
    hooks:
      - id: zizmor
        files: '^\.github/'
        args: [--persona=pedantic]
