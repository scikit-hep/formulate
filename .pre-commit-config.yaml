ci:
  autoupdate_commit_msg: "chore: update pre-commit hooks"
  autofix_commit_msg: "style: pre-commit fixes"
  autoupdate_schedule: monthly

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: requirements-txt-fixer
      - id: trailing-whitespace

  - repo: https://github.com/mgedmin/check-manifest
    rev: "61edb7590386f8b78000219b503e81e24b48c712" # frozen: 0.51
    hooks:
      - id: check-manifest
        stages: [manual]

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: 3a6eb0fadf60b3cccfd80bad9dbb6fae7e47b316 # frozen: v1.10.0
    hooks:
      - id: python-use-type-annotations
      - id: python-check-mock-methods
      - id: python-no-eval
        exclude: "^tests/.*"
      - id: rst-backticks
      - id: rst-directive-colons

  - repo: https://github.com/asottile/pyupgrade
    rev: 75992aaa40730136014f34227e0135f63fc951b4 # frozen: v3.21.2
    hooks:
      - id: pyupgrade
        args: [--py310-plus]

  # Notebook formatting
  - repo: https://github.com/nbQA-dev/nbQA
    rev: d31b7eae1767c43460afb3ba130e0a6602933abe # frozen: 1.9.1
    hooks:
      - id: nbqa-isort
        additional_dependencies: [isort]

      - id: nbqa-pyupgrade
        additional_dependencies: [pyupgrade]
        args: [--py310-plus]

  - repo: https://github.com/kynan/nbstripout
    rev: 34071b78c181af3bf5af955c1426466e096fc3db # frozen: 0.9.1
    hooks:
      - id: nbstripout

  - repo: https://github.com/MarcoGorelli/auto-walrus
    rev: d376c6a49feac78bc2115bf3df7e862629cce612 # frozen: 0.4.1
    hooks:
      - id: auto-walrus

  #   todo: needs rust, reactivate?
  #  - repo: https://github.com/shssoichiro/oxipng
  #    rev: v9.1.4
  #    hooks:
  #      - id: oxipng

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 6b63472e72e1a91ed8a2f6d483790dfb644fa1d3 # frozen: 0.37.4
    hooks:
      - id: check-github-workflows
      - id: check-github-actions
      - id: check-dependabot
      - id: check-readthedocs

  - repo: https://github.com/dannysepler/rm_unneeded_f_str
    rev: 11ea2e723d469f5709897d038e6d2141e7123730 # frozen: v0.2.0
    hooks:
      - id: rm-unneeded-f-str

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "2700fd5671c633760d912769c041bfcde2b9a01b" # frozen: v0.15.22
    hooks:
      - id: ruff-check
        types_or: [python, pyi, jupyter]
        args: [--fix, --show-fixes, --line-length=120]
      # Run the formatter.
      - id: ruff-format
        types_or: [python, pyi, jupyter]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: "41e691678310dfd3833f7ab4e180ddb014310356" # frozen: v2.3.0
    hooks:
      - id: mypy
        files: src
        args: []

  - repo: https://github.com/adamchainz/blacken-docs
    rev: "fda77690955e9b63c6687d8806bafd56a526e45f" # frozen: 1.20.0
    hooks:
      - id: blacken-docs
        additional_dependencies: [black==24.*]

  - repo: https://github.com/codespell-project/codespell
    rev: "57b21406f092110c18776e39b0bda50d37c945c8" # frozen: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli; python_version<'3.11'
        args: ["-L", "gaus"]

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: "9337a74165b178ae2c766f60bee7252a0f06f3e8" # frozen: v3.9.5
    hooks:
      - id: prettier
        types_or: [yaml, markdown, html, css, scss, javascript, json]

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 64a97fb7fa63188393d3215c6e312f5f9c6d0f78 # frozen: v1.27.0
    hooks:
      - id: zizmor
        files: ^.github
        args: [--persona=pedantic]
